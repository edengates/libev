[package]
name = "libev"
version = "0.1.0"
edition = "2024"
description = "A Rust I/O library for the event-driven asynchronous network applications"
license = "Apache-2.0"
repository = "https://github.com/java-nio-toolkit/libev"

[dependencies]
bytes = "1.12.1"
log = { version = "0.4.35", features = ["kv"] }
rustc-hash = "2.1.3"
socket2 = { version = "0.6.5", features = ["all"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
